name: Bug report
description: Something in Monarch doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Focus a Safari window
        2. Press ⌃⌥ ←
        3. ...
  - type: input
    id: version
    attributes:
      label: Monarch version
      description: The first line of the Monarch menu, e.g. "Monarch 0.1.0".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.3, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Displays and input devices
      description: Number of displays, trackpad (built-in / Magic Trackpad) or mouse. Needed for focus and gesture bugs.
  - type: textarea
    id: report
    attributes:
      label: Diagnostics report
      description: Monarch menu → Save Diagnostics Report…, then drag the saved file here. It contains no window titles.
  - type: textarea
    id: config
    attributes:
      label: Changes to config.json
      description: Only the parts you changed from the defaults, if any.
      render: json
