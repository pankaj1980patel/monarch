name: Feature request
description: Suggest a new feature or a change to how something works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Monarch to do?
  - type: textarea
    id: elsewhere
    attributes:
      label: How do other tools handle it?
      description: Rectangle, AeroSpace, yabai, Hammerspoon, ... if you know.
